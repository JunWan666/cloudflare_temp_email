name: build-artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Prepare minimal wrangler.toml for build
        run: |
          cat > worker/wrangler.toml <<'TOML'
          name = "susu"
          main = "src/worker.ts"
          compatibility_date = "2025-04-01"
          compatibility_flags = [ "nodejs_compat" ]
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "susu_cloudflare_temp_email"
          database_id = "09effc22-edd2-4d27-862d-8de1b67b207d"

          [[kv_namespaces]]
          binding = "KV"
          id = "02247f3028ec4d95ab4aefc95da4915a"

          routes = [
            { pattern = "apimail.771566.xyz", custom_domain = true }
          ]
          TOML
          cat worker/wrangler.toml

      - name: Build worker
        working-directory: worker
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          ls -la dist

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://apimail.771566.xyz
          VITE_DEFAULT_LANG: zh
        run: |
          printf 'VITE_API_BASE=https://apimail.771566.xyz\nVITE_DEFAULT_LANG=zh\nVITE_IS_TELEGRAM=false\n' > .env.prod
          pnpm install --no-frozen-lockfile
          pnpm build:pages
          ls -la dist | head -20

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-dist
          path: worker/dist
          retention-days: 7

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Show version
        run: |
          grep -E "VERSION:|DB_VERSION:" worker/src/constants.ts
